spring.datasource.url=jdbc:mysql://localhost:3306/wallet_ledger_test?serverTimezone=UTC
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=UTC

wallet.idempotency.retention=PT168H
wallet.idempotency.cleanup-delay-ms=3600000
