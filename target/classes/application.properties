spring.application.name=wallet

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/local}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

wallet.idempotency.retention=${IDEMPOTENCY_RETENTION:PT24H}
wallet.idempotency.cleanup-delay-ms=${IDEMPOTENCY_CLEANUP_DELAY_MS:3600000}
